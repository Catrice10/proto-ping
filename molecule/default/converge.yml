---
- name: Converge
  hosts: all
  gather_facts: true
  become: true
  tasks:

  # TODO: check whether cache_valid_time skips the first update on a fresh VM.
  # This task failed with "No package matching 'git'" until a manual apt-get update.

  - name: Install package list on VM
    ansible.builtin.apt:
      update_cache: yes
      pkg:
      - curl
      - git
      - caddy
      state: present

  - name: Download and extract uv binary
    ansible.builtin.unarchive:
      src: https://releases.astral.sh/github/uv/releases/download/0.12.23/uv-aarch64-unknown-linux-gnu.tar.gz
      dest: /tmp
      remote_src: true
      creates: "/tmp/uv-aarch64-unknown-linux-gnu/uv"

  - name: Install uv binary to /usr/local/bin
    ansible.builtin.copy:
      src: /tmp/uv-aarch64-unknown-linux-gnu/uv
      dest: /usr/local/bin/uv
      remote_src: true
      mode: "0755"

  - name: Create protoping system user
    ansible.builtin.user:
      name: protoping
      system: yes
      shell: /usr/sbin/nologin
      create_home: yes
      state: present    

  - name: Create /srv/proto-ping directory
    ansible.builtin.file:
      path: /srv/proto-ping
      state: directory
      mode: "0755"
      owner: protoping
      group: protoping

  - name: Copy .service file to /etc/systemd/system/protoping.service
    ansible.builtin.copy:
      src: protoping.service
      dest: /etc/systemd/system/protoping.service
      mode: "0644"

  - name: Start and enable protoping
    ansible.builtin.systemd_service:
      daemon_reload: yes
      name: protoping
      state: started
      enabled: true

  - name: Install caddy
    ansible.builtin.apt:
      name: caddy
      state: present

  - name: Copy Caddyfile to /etc/caddy/Caddyfile
    ansible.builtin.copy:
      src: Caddyfile
      dest: /etc/caddy/Caddyfile
      mode: "0644"
      owner: caddy
      group: caddy
  
  - name: Restart and enable caddy
    ansible.builtin.systemd_service:
      daemon_reload: yes
      name: caddy
      state: reloaded
      enabled: true